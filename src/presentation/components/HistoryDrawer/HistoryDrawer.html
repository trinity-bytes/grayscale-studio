<div id="history-drawer-overlay" class="history-drawer-overlay" hidden></div>
<section id="history-drawer-container" class="history-drawer-container" role="dialog" aria-modal="true" aria-labelledby="history-title" tabindex="-1" hidden>
  <header class="history-header">
    <h2 id="history-title">Historial</h2>
    <button type="button" id="history-close-btn" class="history-close" aria-label="Cerrar historial">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div id="history-main" class="history-main">
    <div id="history-content-area" class="history-content-area">
      <div id="history-empty-state" class="history-empty-state">
        <h3>No hay operaciones aún</h3>
        <p>Las ecualizaciones y expansiones aparecerán aquí.</p>
      </div>
      <div id="history-list" class="history-list hidden" role="list" aria-label="Operaciones anteriores"></div>
    </div>
    <footer id="history-footer" class="history-footer hidden">
      <p>Hasta 20 operaciones · Guardado en este navegador</p>
      <button type="button" id="history-clear-btn" class="history-button">Limpiar historial</button>
    </footer>
  </div>
  <div id="history-clear-confirmation" class="history-confirmation" hidden>
    <h3 id="history-confirm-title">¿Limpiar el historial?</h3>
    <p id="history-confirm-description">Se eliminarán las operaciones guardadas en este navegador. Esta acción no se puede deshacer.</p>
    <div class="history-confirm-actions">
      <button type="button" id="history-cancel-clear-btn" class="history-button">Cancelar</button>
      <button type="button" id="history-confirm-clear-btn" class="history-button history-button-primary">Limpiar historial</button>
    </div>
  </div>
</section>
